global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/prometheus-rules.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: log-platform-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8103"]
  - job_name: log-platform-consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8104"]
