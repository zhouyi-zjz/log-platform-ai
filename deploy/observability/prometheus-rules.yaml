groups:
  - name: log-platform-kafka
    interval: 30s
    rules:
      - alert: LogPlatformKafkaMonitoringMissing
        expr: absent(log_platform_kafka_available{role="api"}) == 1
        for: 5m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: Kafka 自监控指标缺失
          description: Prometheus 未发现日志平台 API 实例暴露的 Kafka 自监控指标。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaUnavailable
        expr: |
          max(log_platform_kafka_available{role="api"}) == 0
            or time() - max(log_platform_kafka_monitor_last_success_unixtime{role="api"}) > 120
        for: 2m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: 日志平台无法访问 Kafka
          description: Kafka Admin API 连续采集失败或快照超过 2 分钟未刷新，入口 ack、消费积压和 Topic 健康状态均不可信。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaBrokerCountLow
        expr: |
          min(log_platform_kafka_broker_count{role="api"} >= 0)
            < max(log_platform_kafka_expected_broker_count{role="api"})
        for: 2m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: Kafka 在线 broker 数低于预期
          description: 日志平台可见的 broker 数少于部署配置，副本容灾能力已下降。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaOfflinePartitions
        expr: max(log_platform_kafka_offline_partitions{role="api"}) > 0
        for: 1m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: 日志 Topic 存在离线分区
          description: logs.raw 或 logs.raw.DLT 存在无 leader 分区，相关日志当前不可读写。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaUnderReplicatedPartitions
        expr: max(log_platform_kafka_under_replicated_partitions{role="api"}) > 0
        for: 5m
        labels:
          severity: warning
          signal: kafka
        annotations:
          summary: 日志 Topic 副本同步不足
          description: logs.raw 或 logs.raw.DLT 的 ISR 少于副本数，持续故障可能导致可用性下降。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaPublishFailures
        expr: sum(increase(log_platform_kafka_publish_failures_total{role="api"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          signal: kafka
        annotations:
          summary: HTTP 日志入口持续无法获得 Kafka ack
          description: Kafka 发布或 broker ack 在配置的超时时间内失败，客户端已收到 503。
          runbook: docs/operations/observability-runbook.md#kafka
      - alert: LogPlatformKafkaConsumerMetricsMissing
        expr: absent(log_platform_consumer_events_total{role="consumer"}) == 1
        for: 5m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: Kafka Consumer 指标缺失
          description: Prometheus 无法抓取日志消费实例，消费进程可能已停止或监控网络不可达。
          runbook: docs/operations/observability-runbook.md#kafka-consumer
      - alert: LogPlatformKafkaConsumerLagHigh
        expr: max(log_platform_consumer_lag{role="api"}) > 10000
        for: 10m
        labels:
          severity: warning
          signal: kafka
        annotations:
          summary: Kafka 日志消费积压持续升高
          description: logs-es-writer 消费组总 lag 持续超过 10000 条。
          runbook: docs/operations/observability-runbook.md#kafka-consumer
      - alert: LogPlatformKafkaConsumerLagCritical
        expr: max(log_platform_consumer_lag{role="api"}) > 100000
        for: 5m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: Kafka 日志消费严重积压
          description: logs-es-writer 消费组总 lag 持续超过 100000 条，日志可见性延迟显著增加。
          runbook: docs/operations/observability-runbook.md#kafka-consumer
      - alert: LogPlatformKafkaConsumerStalled
        expr: |
          max(log_platform_consumer_lag{role="api"}) > 0
            and (sum(increase(log_platform_consumer_events_total{role="consumer"}[10m])) or vector(0)) == 0
        for: 10m
        labels:
          severity: critical
          signal: kafka
        annotations:
          summary: Kafka 消费有积压但无进展
          description: logs-es-writer 仍有积压，但 Consumer 10 分钟内没有成功处理事件。
          runbook: docs/operations/observability-runbook.md#kafka-consumer
  - name: log-platform-ingest
    interval: 30s
    rules:
      - alert: LogPlatformIngestRejected
        expr: |
          sum(rate(log_platform_ingest_rejected_total[5m]))
            / clamp_min(sum(rate(log_platform_ingest_accepted_total[5m])) + sum(rate(log_platform_ingest_rejected_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          signal: logs
        annotations:
          summary: 日志接入拒绝率持续升高
          runbook: docs/operations/observability-runbook.md#ingest
      - alert: LogPlatformBulkFailures
        expr: sum(rate(log_platform_bulk_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          signal: logs
        annotations:
          summary: Elasticsearch Bulk 持续失败
          runbook: docs/operations/observability-runbook.md#elasticsearch
  - name: log-platform-query
    interval: 30s
    rules:
      - alert: LogPlatformQueryP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(log_platform_query_latency_seconds_bucket[10m]))) > 3
        for: 10m
        labels:
          severity: warning
          signal: query
        annotations:
          summary: 日志查询 P95 超过 3 秒
          runbook: docs/operations/observability-runbook.md#query
  - name: log-platform-trace
    interval: 1m
    rules:
      - alert: LogPlatformTraceCompletenessLow
        expr: |
          sum(rate(log_platform_trace_completeness_complete_total[15m]))
            / clamp_min(sum(rate(log_platform_trace_completeness_inspected_total[15m])), 1) < 0.99
        for: 15m
        labels:
          severity: warning
          signal: trace
        annotations:
          summary: Trace 关联完整率低于 99%
          runbook: docs/operations/observability-runbook.md#trace
      - alert: LogPlatformTempoUnavailable
        expr: rate(log_platform_tempo_lookup_failure_total[10m]) > 0
        for: 15m
        labels:
          severity: info
          signal: trace
        annotations:
          summary: Tempo 联查不可用，日志查询仍保持可用
          runbook: docs/operations/observability-runbook.md#tempo
  - name: log-platform-finops-and-dlt
    interval: 30s
    rules:
      - alert: LogPlatformFinopsAuditProjectionFailures
        expr: rate(log_platform_finops_audit_write_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          signal: finops-audit
        annotations:
          summary: FinOps 预算审计只读投影持续失败
          runbook: docs/operations/observability-runbook.md#finops-audit
      - alert: LogPlatformDltBacklog
        expr: max(log_platform_dlt_pending_records{role="api"}) > 0
        for: 10m
        labels:
          severity: warning
          signal: dlt
        annotations:
          summary: DLT 存在持续积压，需要管理员分析或安全重放
          runbook: docs/operations/observability-runbook.md#dlt
      - alert: LogPlatformDltReplayFailures
        expr: rate(log_platform_dlt_replay_failure_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          signal: dlt
        annotations:
          summary: DLT 安全重放持续失败
          runbook: docs/operations/observability-runbook.md#dlt
