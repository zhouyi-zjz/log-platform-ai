# Fluent Bit 日志采集示例：从应用 stdout 读取 JSON，保留平台约定的点号字段，
# 通过 Kafka 输出到 logs.raw。生产环境请把 broker、TLS 和认证信息放到 Secret。
[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 64M

[INPUT]
    Name              tail
    Path              /var/log/apps/*.log
    Tag               app.logs
    Parser            json
    Read_from_Head   false
    DB                /var/lib/fluent-bit/tail.db
    Mem_Buf_Limit     32M
    Skip_Long_Lines   On
    storage.type      filesystem

# 直接写 Kafka 是首选路径；如果项目无法安装 Kafka 输出插件，可改用 HTTP /ingest。
[OUTPUT]
    Name                  kafka
    Match                 app.logs
    Brokers               ${KAFKA_BROKERS}
    Topics                logs.raw
    rdkafka.request.required.acks  -1
    rdkafka.compression.codec     lz4
    rdkafka.message.send.max.retries 5
    rdkafka.retry.backoff.ms      1000
    rdkafka.enable.idempotence    true

# 生产建议开启 TLS/SASL（示例配置，证书路径按部署环境替换）：
#    rdkafka.security.protocol     SASL_SSL
#    rdkafka.sasl.mechanism        SCRAM-SHA-512
#    rdkafka.sasl.username         ${KAFKA_USERNAME}
#    rdkafka.sasl.password         ${KAFKA_PASSWORD}
#    rdkafka.ssl.ca.location       /etc/fluent-bit/certs/ca.crt
