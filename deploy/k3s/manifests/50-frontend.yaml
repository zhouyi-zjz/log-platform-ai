apiVersion: v1
kind: Service
metadata:
  name: log-platform-frontend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: log-platform-frontend
spec:
  selector:
    app.kubernetes.io/name: log-platform-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-platform-frontend
  namespace: ${NAMESPACE}
spec:
  replicas: ${FRONTEND_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: log-platform-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-platform-frontend
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
