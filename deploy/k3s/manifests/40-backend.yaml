apiVersion: v1
kind: Service
metadata:
  name: log-platform-backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: log-platform-backend
spec:
  selector:
    app.kubernetes.io/name: log-platform-backend
  ports:
    - name: http
      port: 8103
      targetPort: 8103
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-platform-backend
  namespace: ${NAMESPACE}
spec:
  replicas: ${BACKEND_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-platform-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-platform-backend
    spec:
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - name: http
              containerPort: 8103
          env:
            - name: SERVER_PORT
              value: "8103"
            - name: SESSION_COOKIE_SECURE
              value: "${SESSION_COOKIE_SECURE}"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/log-platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
            - name: DB_USERNAME
              value: "${DB_USERNAME}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: log-platform-db
                  key: app-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_CONSUMER_GROUP
              value: logs-es-writer
            - name: LOG_KAFKA_TOPIC
              value: logs.raw
            - name: LOG_CONSUMER_ENABLED
              value: "true"
            - name: LOG_TOPIC_AUTO_CREATE
              value: "false"
            - name: LOG_TOPIC_PARTITIONS
              value: "6"
            - name: LOG_TOPIC_REPLICATION_FACTOR
              value: "${KAFKA_REPLICATION_FACTOR}"
            - name: LOG_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: log-platform-app
                  key: ingest-token
            - name: ELASTICSEARCH_ENDPOINTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_INDEX
              value: logs-platform-default
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /monitor/api/auth/csrf
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
