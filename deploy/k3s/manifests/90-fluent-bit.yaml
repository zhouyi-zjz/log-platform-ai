apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: ${NAMESPACE}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: ${FLUENT_BIT_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: app-logs
              mountPath: /var/log/apps
              readOnly: true
            - name: buffer
              mountPath: /var/lib/fluent-bit
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: log-platform-fluent-bit-config
        - name: app-logs
          hostPath:
            path: /var/log/apps
            type: DirectoryOrCreate
        - name: buffer
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
